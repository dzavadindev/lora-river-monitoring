[package]
edition      = "2021"
name         = "iot_lora_esp32s3"
rust-version = "1.86"
version      = "0.1.0"

[[bin]]
name = "Iot_Lora_Esp32s3"
path = "./src/bin/main.rs"

[dependencies]
defmt = "0.3.10"
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32s3"] }
esp-hal                = { version = "=1.0.0-rc.0", features = ["esp32s3", "unstable"] }
embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }
critical-section = "1.2.0"
embassy-executor = { version = "0.7.0", features = ["task-arena-size-20480"] }
embassy-sync = "0.6.2"
embassy-time     = "0.4.0"
esp-hal-embassy  = { version = "0.9.0", features = ["esp32s3"] }

rtt-target       = "0.6.1"
lora-phy = "3.0.1"
esp-println = { version = "0.13.1", features = ["esp32s3", "defmt-espflash"] }
static_cell      = "2.1.1"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
